name: Static website checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static website integrity
        run: node tests/check-site.mjs
      - name: Check preliminary V1 sensitivity utilities
        run: node tests/v1-sensitivity.mjs
      - name: Check V1 toy mass-energy iteration
        run: node tests/v1-mass-energy-closure.mjs
      - name: Check V1 architecture evidence gates
        run: node tests/v1-architecture-gates.mjs
      - name: Check V1 parallel architecture workstreams
        run: node tests/v1-dual-architecture-workstreams.mjs
      - name: Check V1 evidence acceptance gates
        run: node tests/v1-parallel-evidence-gates.mjs
      - name: Validate V1 engineering evidence intake schema
        run: node tests/v1-evidence-intake.mjs
      - name: Check cockpit language and mode switching
        run: node tests/cockpit-interaction.mjs
