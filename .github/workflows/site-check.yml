name: Static website checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static website integrity
        run: node tests/check-site.mjs
      - name: Check preliminary V1 sensitivity utilities
        run: node tests/v1-sensitivity.mjs
